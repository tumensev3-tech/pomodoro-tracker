name: Build Focuslot release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Signed Focuslot APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FOCUSLOT_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.FOCUSLOT_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOCUSLOT_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FOCUSLOT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          mkdir -p "$HOME/.pomodoro"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.pomodoro/focuslot-release.jks"
          chmod 600 "$HOME/.pomodoro/focuslot-release.jks"
          cat > "$HOME/.pomodoro/keystore.properties" <<EOF
          storeFile=$HOME/.pomodoro/focuslot-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 "$HOME/.pomodoro/keystore.properties"

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload signed release
        uses: actions/upload-artifact@v7
        with:
          name: focuslot-1.0.0-signed-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 30
